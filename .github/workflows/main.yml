name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      DEVICE_TARGET: "iphone:clang:16.5:16.0"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: cache sdks
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-16.5

      - name: download sdks
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p theos/sdks
          mv sdks-master/*.sdk theos/sdks/
          rm -rf master.zip sdks-master

      - name: set THEOS env var
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: install deps
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: build rootless package
        run: |
          set -e
          make clean
          make package \
            ARCHS="arm64 arm64e" \
            TARGET="$DEVICE_TARGET" \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1
          ls -la packages/

      - name: upload package
        uses: actions/upload-artifact@v4
        with:
          name: rootless-package
          path: packages/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download package artifact
        uses: actions/download-artifact@v4
        with:
          name: rootless-package
          path: ./packages

      - name: update nightly release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./packages/*.deb"
          allowUpdates: true
          tag: nightly
          name: "Nightly Build (v1.2.1 - run #${{ github.run_number }})"
          makeLatest: true
          body: |
            This build was automatically generated from the latest commit on `main`.
            
            **Commit SHA:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}
            
            > [!NOTE]
            > A nightly build is basically the next update partially done. Additionally, this build might have the old version number but the code itself should has the latest commit.
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
